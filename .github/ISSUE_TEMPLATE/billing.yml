name: Plans and limits
description: A question about your allowance or how it is counted
labels: ["billing"]
body:
  - type: markdown
    attributes:
      value: |
        **Changing a plan, cancelling, and anything to do with a charge is handled by GitHub rather than here.**
        GitHub takes the payment and issues any refund, so they are the ones who can act on it.
        Manage your plan from the [Marketplace listing](https://github.com/marketplace/whatproblem-ai-requirements-clarification-bot), and take a charge you did not
        expect to [GitHub billing support](https://support.github.com/contact).

        This form is for how the allowance itself works: what counts against it, and what happens
        when you run out.
  - type: input
    id: account
    attributes:
      label: The account the app is installed on
      description: Your GitHub username or organization name. We need this to look anything up.
    validations:
      required: true
  - type: dropdown
    id: topic
    attributes:
      label: What is this about
      options:
        - I have run out of my monthly allowance
        - I do not understand what counts against my allowance
        - The number I am seeing looks wrong
        - Something else about how allowances work
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: Details
      description: |
        No need to name a private repository. "a private repo" is enough, we can find it from the account name.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Please do not paste payment details, tokens or anything else secret here. This repository is public.
