name: Plans, limits or billing
description: A question about your allowance, your plan, or a charge
labels: ["billing"]
body:
  - type: input
    id: account
    attributes:
      label: The account the app is installed on
      description: Your GitHub username or organization name. We need this to look anything up.
    validations:
      required: true
  - type: dropdown
    id: topic
    attributes:
      label: What is this about
      options:
        - I have run out of my monthly allowance
        - I do not understand what counts against my allowance
        - I want to change or cancel my plan
        - A charge I did not expect
        - Something else
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: Details
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Please do not paste payment details, tokens or anything else secret here. This repository is public.
