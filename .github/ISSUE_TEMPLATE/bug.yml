name: Bug report
description: The bot responded, but something about it was wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a public repository, a link is the fastest way for us to see it. If the
        repository is private, or you would rather not name it here, email
        <support@whatproblem.dev> instead and we will take it from there.
  - type: input
    id: issue-url
    attributes:
      label: Link to the issue or comment
      description: Leave blank if the repository is private. Do not paste the name of a private repository.
      placeholder: https://github.com/owner/repo/issues/123#issuecomment-...
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part of it
      options:
        - The questions it asked were wrong or unhelpful
        - A diagram rendered badly or not at all
        - It replied more than once, or kept going
        - It commented somewhere it should not have
        - The clarity score looks wrong
        - Something else
    validations:
      required: true
