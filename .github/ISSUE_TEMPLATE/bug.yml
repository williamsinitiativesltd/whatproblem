name: Bug report
description: The bot responded, but something about it was wrong
labels: ["bug"]
body:
  - type: input
    id: issue-url
    attributes:
      label: Link to the issue or comment
      placeholder: https://github.com/owner/repo/issues/123#issuecomment-...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part of it
      options:
        - The questions it asked were wrong or unhelpful
        - A diagram rendered badly or not at all
        - It replied more than once, or kept going
        - It commented somewhere it should not have
        - The clarity score looks wrong
        - Something else
    validations:
      required: true
